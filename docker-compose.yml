name: venueos

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d booking"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672" # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  catalog:
    build: ./services/catalog
    restart: unless-stopped
    environment:
      PORT: 4001
      MONGO_URL: mongodb://mongo:27017/catalog
      # Redis DB 1 - booking owns DB 0. Same container, separate logical
      # database, exactly like the shared Postgres with a database per service.
      CACHE_REDIS_URL: redis://redis:6379/1
      JWT_SECRET: dev-only-not-a-real-secret
    ports:
      - "4001:4001"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  booking:
    build: ./services/booking
    restart: unless-stopped
    environment:
      PORT: 4002
      DATABASE_URL: postgres://dev:dev@postgres:5432/booking
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://rabbitmq:5672
      GATEWAY_URL: http://gateway:8080
      JWT_SECRET: dev-only-not-a-real-secret
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  auth:
    build: ./services/auth
    restart: unless-stopped
    environment:
      PORT: 4005
      DATABASE_URL: postgres://dev:dev@postgres:5432/auth
      # Dev-only shared secret. Every service verifies tokens with this same
      # HS256 key, which also means any service could mint one - the trade-off
      # is recorded in DESIGN.md. A real deploy uses RS256 and a real secret
      # store, and this value never appears in a compose file.
      JWT_SECRET: dev-only-not-a-real-secret
    ports:
      - "4005:4005"
    depends_on:
      postgres:
        condition: service_healthy

  payment:
    build: ./services/payment
    restart: unless-stopped
    environment:
      PORT: 4003
      DATABASE_URL: postgres://dev:dev@postgres:5432/payment
      JWT_SECRET: dev-only-not-a-real-secret
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy

  notifications:
    build: ./services/notifications
    restart: unless-stopped
    environment:
      PORT: 4004
      RABBITMQ_URL: amqp://rabbitmq:5672
      # Redis DB 2 - booking owns 0, catalog owns 1. Consumer-side dedupe.
      DEDUPE_REDIS_URL: redis://redis:6379/2
    ports:
      - "4004:4004"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      PORT: 8080
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 120
      CATALOG_URL: http://catalog:4001
      AUTH_URL: http://auth:4005
      BOOKING_URL: http://booking:4002
      PAYMENT_URL: http://payment:4003
      NOTIFICATIONS_URL: http://notifications:4004
    ports:
      - "8080:8080"
    depends_on:
      - catalog
      - booking
      - payment
      - notifications
      - auth

  # Observability, off by default so `docker compose up -d` and CI stay lean:
  #   docker compose --profile monitoring up -d
  # Prometheus scrapes each service's /metrics directly on this network; those
  # endpoints are deliberately NOT reachable through the gateway.
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Local-only convenience: no login wall on a dashboard that shows nothing
      # sensitive and is bound to a dev machine. Do not carry this to a deploy.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # Load testing, off by default:
  #   docker compose --profile loadtest run --rm k6 run /scripts/flash-sale.js -e EVENT_ID=<id>
  # Run it against the test overlay - the default rate limit would throttle the
  # load generator, which measures the limiter instead of the locking strategy.
  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    environment:
      GATEWAY_URL: http://gateway:8080
    volumes:
      - ./loadtest:/scripts:ro
    depends_on:
      - gateway

volumes:
  mongo-data:
  postgres-data:
  prometheus-data:
  grafana-data:
